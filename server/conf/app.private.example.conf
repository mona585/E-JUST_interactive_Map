###
# THE MAIN SETTINGS OF THE APPLICATION.
# NEVER SHARE OR PUBLISH AS IT CONTAINS PASSWORDS.
#
# INFO: copy to app.private.conf and use
###

public.baseUrl=${?PUBLIC_BASE_URL}
server.address=${public.baseUrl}
server.port="443"
application.secret="CHANGE_ME_APPLICATION_SECRET"
play.http.secret.key="CHANGE_ME_APPLICATION_SECRET"

###
# Database: Mongodb
###
# Supplied by the protected systemd environment file; see
# docs/recovery/PHASE_2_STAGING_RUNBOOK.md. The initial deployment baseline is
# a MongoDB listener on loopback only with authentication enabled.
mongodb.hostname=${MONGODB_HOST}
mongodb.app.username=${MONGODB_USERNAME}
mongodb.app.password=${MONGODB_PASSWORD}
mongodb.port=${MONGODB_PORT}
mongodb.database=${MONGODB_DATABASE}

###
# salt and pepper to encrypt user's passwords
###
password.salt="CHANGE_ME_PASSWORD_SALT"
password.pepper="CHANGE_ME_PASSWORD_PEPPER"

###
# Administrator bootstrap (D-05/R-14): protects the ONE-TIME, private
# POST /api/user/bootstrap-admin call that creates the sole initial
# Administrator. Public POST /api/user/register can never grant admin.
# Generate a random value, use it once, then rotate/blank it out again;
# see docs/recovery/PHASE_5_DATA_RUNBOOK.md. Leaving the placeholder value
# disables the bootstrap endpoint entirely.
###
admin.bootstrapToken="CHANGE_ME_ADMIN_BOOTSTRAP_TOKEN"

###
# Filesystem:
#
# - Raw data:
#  + floorplans, radiomaps, crlb data
###
floorPlansRootDir = "floorplans"
radioMapRawDir="radiomaps_raw"
radioMapFrozenDir="radiomaps_frozen"
tilerRootDir="anyplace_tiler"

###
# CORS: allowed browser origins for cross-origin API requests.
# Set to match your actual deployment origin(s).
# Example for E-JUST production:
###
cors.allowedOrigins = ["http://anyplace.ejust.edu.eg:443"]

###
# Analytics: disabled by default (D-08/D-09 decision).
# Set to true only if you have explicit E-JUST consent and have configured
# a university-controlled analytics key.
###
analytics.enabled = false
