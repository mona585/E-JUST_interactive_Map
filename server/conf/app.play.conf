# PLAY CONFIGURATION:
# Logging:
# - Using conf/logback.xml MORE: http://logback.qos.ch/

# Evolutions
# ~~~~~
# You can disable evolutions if needed
# evolutionplugin=disabled

# Ebean configuration
# ~~~~~
# You can declare as many Ebean servers as you want.
# By convention, the default server is named `default`
# ebean.default="models.*"

# Try to use only IPv4
java.net.preferIPv4Stack=true

# HttpOnly stays on: no code reads PLAY_SESSION via JS.
play.http.session.httpOnly=true

# play.filters.https.port = 9443  TODO: custom port
# maybe use: play.filters.https.port=${server.port}

#play.filters.https.redirectEnabled = true # CLR:PM ?

play.modules {
  enabled += "play.filters.csrf.CSRFModule"
  enabled += "play.filters.cors.CORSModule"
  enabled += "play.filters.headers.SecurityHeadersModule"
  enabled += "play.filters.gzip.GzipFilterModule"
}

play.filters {
  csrf {
    # Token configuration
    token {
      # The token name
      name = "csrfToken"
      # Whether tokens should be signed or not
      sign = true
    }

    # Cookie configuration
    cookie {
      # If non null, the CSRF token will be placed in a cookie with this name
      name = null
      # Whether the cookie should be set to secure
      secure = ${play.http.session.secure}
      # Whether the cookie should have the HTTP only flag set
      # HttpOnly stays on: clients never read it via JS.
      httpOnly = true
    }

    # How much of the body should be buffered when looking for the token in the request body
    body.bufferSize = ${play.http.parser.maxMemoryBuffer}

    # Header configuration
    header {
      # The name of the header to accept CSRF tokens from.
      name = "Csrf-Token"
      # Whether simple tokens in the header should allow CSRF checks to be bypassed.
      bypass = true
    }

    # Method lists
    method {
      # If non empty, then requests will be checked if the method is not in this list.
      whiteList = []
      # The black list is only used if the white list is empty.
      # Only check methods in this list.
      blackList = ["POST"]
    }

    # Content type lists
    contentType {
      # If non empty, then requests will be checked if the content type is not in this list.
      whiteList = []
      # The black list is only used if the white list is empty.
      # Only check content types in this list.
      blackList = ["application/x-www-form-urlencoded", "multipart/form-data", "text/plain"]
    }

    # The error handler.
    # Used by Play's built in DI support to locate and bind a request handler.  Must be one of the following:
    # - A FQCN that implements play.filters.csrf.CSRF.ErrorHandler (Scala).
    # - A FQCN that implements play.filters.csrf.CSRFErrorHandler (Java).
    # - provided, indicates that the application has bound an instance of play.filters.csrf.CSRF.ErrorHandler through some
    #   other mechanism.
    # If null, will attempt to load a class called CSRFErrorHandler in the root package, otherwise if that's
    # not found, will default to play.filters.csrf.CSRF.CSRFHttpErrorHandler, which delegates to the configured
    # HttpRequestHandler.
    errorHandler = null
  }

  # Security headers filter configuration
  headers {

    # The X-Frame-Options header. If null, the header is not set.
    frameOptions = "DENY"

    # The X-XSS-Protection header. If null, the header is not set.
    xssProtection = "1; mode=block"

    # The X-Content-Type-Options header. If null, the header is not set.
    contentTypeOptions = "nosniff"

    # The X-Permitted-Cross-Domain-Policies header. If null, the header is not set.
    permittedCrossDomainPolicies = "master-only"

    # The Content-Security-Policy header.
    # Covers Maps/CDN/fonts/tiles, same-origin API/XHR, blob workers; unsafe-inline for first-party snippets.
    # Remove an entry only with the tag that loads it; frame-ancestors 'none' blocks third-party embeds.
    contentSecurityPolicy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://maps.googleapis.com https://cdnjs.cloudflare.com https://ajax.googleapis.com https://maxcdn.bootstrapcdn.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://ajax.googleapis.com https://maxcdn.bootstrapcdn.com https://stackpath.bootstrapcdn.com; img-src 'self' data: https://*.googleapis.com https://*.gstatic.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://cartodb-basemaps-a.global.ssl.fastly.net https://raw.githubusercontent.com blob:; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com https://maxcdn.bootstrapcdn.com data:; connect-src 'self' https://maps.googleapis.com; frame-src 'self' https://www.youtube.com; frame-ancestors 'none'"

    # Referrer policy: don't leak origin on external navigations
    referrerPolicy = "strict-origin-when-cross-origin"
  }

  # CORS filter configuration
  cors {

    # The path prefixes to filter.
    pathPrefixes = ["/"]

    # The allowed origins.
    # Override in app.private.conf: cors.allowedOrigins = ["http://anyplace.ejust.edu.eg:443"]
    # If null, all origins are allowed (open — unsafe for production).
    allowedOrigins = ${?cors.allowedOrigins}

    # The allowed HTTP methods. If null, all methods are allowed
    allowedHttpMethods = null

    # The allowed HTTP headers. If null, all headers are allowed.
    allowedHttpHeaders = null

    # The exposed headers
    exposedHeaders = []

    # Whether to support credentials
    supportsCredentials = true

    # The maximum amount of time the CORS meta data should be cached by the client
    preflightMaxAge = 1 hour
  }

  # GZip filter configuration
  gzip {

    # The buffer size to use for gzipped bytes
    bufferSize = 8k

    # The maximum amount of content to buffer for gzipping in order to calculate the content length before falling back
    # to chunked encoding.
    chunkedThreshold = 100k

  }
}

# Dedicated dispatcher for blocking MongoDB/file I/O; keeps default pool free for bursts.
contexts {
  blocking-io-dispatcher {
    executor = "thread-pool-executor"
    throughput = 1
    thread-pool-executor {
      fixed-pool-size = 64
      queue-size = 1000
    }
  }
  tiler-dispatcher {
    executor = "thread-pool-executor"
    throughput = 1
    thread-pool-executor {
      fixed-pool-size = 4
      queue-size = 100
    }
  }
}
