# Test-only configuration for public routes that do not require MongoDB.
# Mongo-backed integration tests are explicitly enabled only on the controlled
# Ubuntu staging environment; see RUN_MONGO_INTEGRATION_TESTS.
include "app.base.conf"
include "app.play.conf"

server.address="http://localhost"
server.port="9000"
application.secret="test-application-secret-not-for-deployment"
play.http.secret.key="test-play-secret-not-for-deployment"

# Supplied only for RUN_MONGO_INTEGRATION_TESTS=true on the controlled staging
# VM. Default API tests do not construct a MongoDB-backed controller.
mongodb.hostname=${?MONGODB_TEST_HOST}
mongodb.port=${?MONGODB_TEST_PORT}
mongodb.database=${?MONGODB_TEST_DATABASE}
mongodb.app.username=${?MONGODB_TEST_USERNAME}
mongodb.app.password=${?MONGODB_TEST_PASSWORD}

password.salt="test-salt"
password.pepper="test-pepper"
cors.allowedOrigins = ["http://localhost:9000"]
analytics.enabled = false
