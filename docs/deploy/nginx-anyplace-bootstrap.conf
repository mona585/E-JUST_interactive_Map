# Anyplace campus Nginx — BOOTSTRAP (HTTP only, pre-certificate).
#
# Use this file FIRST: the full nginx-anyplace-campus.conf references
# /etc/letsencrypt paths that do not exist until certbot runs, so `nginx -t`
# fails with the full file on a fresh host. Phases:
#   1. Install THIS file, `nginx -t`, reload, verify http://<domain>/api/health.
#   2. `certbot certonly --webroot -w /var/www/html -d <domain>`
#      (certbot drops a challenge file under .well-known; served below).
#   3. Replace with nginx-anyplace-campus.conf, `nginx -t`, reload, verify https.
# No HSTS here on purpose: never pin HTTPS before the certificate exists.

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=perip:10m;

upstream anyplace_play {
  server 127.0.0.1:9000;
  keepalive 32;
}

server {
  listen 80;
  server_name anyplace.ejust.edu.eg;

  # ACME challenge must be served locally, never proxied.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
  }

  client_max_body_size 100M;

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_connect_timeout 10s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://anyplace_play;
  }

  location = /api/user/login {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://anyplace_play;
  }

  location = /api/user/register {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://anyplace_play;
  }

  location = /api/user/refresh {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://anyplace_play;
  }

  location /api/floortiles/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://anyplace_play;
  }

  location /architect/ {
    proxy_pass http://anyplace_play;
  }

  location /viewer/ {
    proxy_pass http://anyplace_play;
  }

  location /developers/ {
    proxy_pass http://anyplace_play;
  }

  location /assets/ {
    proxy_pass http://anyplace_play;
  }

  location = / {
    return 302 /viewer/;
  }
}
