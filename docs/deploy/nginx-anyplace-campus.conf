# E-JUST Anyplace — campus-pilot production Nginx (native, no containers).
# Host: E-JUST Ubuntu VM. Play on 127.0.0.1:9000. TLS via certbot.
# Order matters:
#   1. cp this file to /etc/nginx/sites-available/anyplace + symlink to sites-enabled
#   2. sudo certbot --nginx -d anyplace.ejust.edu.eg   (writes the ssl_certificate lines)
#   3. sudo nginx -t && sudo systemctl reload nginx
# Replace anyplace.ejust.edu.eg with the real domain in both server blocks.
# NOTE: every /api/* path proxies to Play; per-endpoint authorization is
# enforced by Play (token gates), not by Nginx path filtering.

upstream anyplace_play {
  server 127.0.0.1:9000;
  keepalive 32;
}

# API rate limit: 20 req/s burst 40 per IP (campus pilot size). Applies to all
# API locations including /api/health (no unauthenticated bypass).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# HTTP -> HTTPS redirect (certbot extends this block)
server {
  listen 80;
  server_name anyplace.ejust.edu.eg;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name anyplace.ejust.edu.eg;

  # Written by `certbot --nginx` on first run; nginx -t fails until then.
  ssl_certificate /etc/letsencrypt/live/anyplace.ejust.edu.eg/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/anyplace.ejust.edu.eg/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  access_log /var/log/nginx/anyplace.access.log;
  error_log /var/log/nginx/anyplace.error.log warn;

  client_max_body_size 100M;
  client_body_timeout 60s;
  client_header_timeout 60s;

  # No preload: this subdomain must never pin the parent university domain.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # X-Frame-Options + CSP come from Play SecurityHeadersFilter; do not duplicate here.

  # Never leak Play stack traces as HTML to API clients on bad gateways.
  proxy_intercept_errors on;
  error_page 502 504 = @api_unavailable;

  # Shared proxy hygiene: identical on every location (logs, keepalive, timeouts).
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;
  proxy_connect_timeout 10s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://anyplace_play;
  }

  # Real Play route: GET /floortiles/zip/*file (tile archives).
  location /floortiles/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://anyplace_play;
    expires 7d;
  }

  # Play serves /architect /viewer from server/public (see WebAppController +
  # MainController; /viewer?cuid= selects the campus app server-side).
  location /architect/ {
    proxy_pass http://anyplace_play;
    expires 1h;
  }

  location /viewer/ {
    proxy_pass http://anyplace_play;
    expires 1h;
  }

  # Developer portal (static) + generated swagger.json it fetches.
  location /developers/ {
    proxy_pass http://anyplace_play;
    expires 1h;
  }

  location /assets/ {
    proxy_pass http://anyplace_play;
    expires 7d;
  }

  # Root only: Play's own GET / redirects to /viewer already; keep the
  # explicit rule so probes and bookmarks land right without shadowing
  # /assets/* or /developers/* (exact match, unlike the old `location /`).
  location = / {
    return 302 /viewer/;
  }

  location @api_unavailable {
    default_type application/json;
    return 503 '{"status":"error","message":"Backend unavailable, retry shortly.","status_code":503}';
  }
}
