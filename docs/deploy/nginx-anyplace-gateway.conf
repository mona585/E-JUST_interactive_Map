# E-JUST Anyplace — Nginx behind the university TLS gateway (TEMPLATE).
# Use ONLY after confirming that the public 443 endpoint terminates TLS at the
# campus reverse proxy and forwards plain HTTP to this VM. In that mode the VM
# must NOT redirect HTTP to HTTPS (that would loop) and must NOT run certbot.
# If the VM terminates TLS directly, use nginx-anyplace-campus.conf instead.
#
# Before installing:
#   1. Replace GATEWAY_IP_OR_CIDR with the proxy address(es) from IT.
#   2. Confirm the proxy preserves Host and sets X-Forwarded-Proto.
#   3. sudo nginx -t && sudo systemctl reload nginx
# NOTE: every /api/* path proxies to Play; authorization is enforced by Play.

upstream anyplace_play {
  server 127.0.0.1:9000;
  keepalive 32;
}

# Rate tiers keyed by the real client address. The real_ip block below must be
# correct, otherwise every request appears to come from the gateway.
# General API: 20 r/s burst 40 (class-change bursts). Auth endpoints get their
# own strict zone: credential-stuffing defense (5 r/m burst 5).
# Rejections answer 429 (not default 503) so clients can back off correctly.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_status 429;
limit_req_log_level warn;
# Slow-client protection: cap concurrent connections per IP (tune after access-log review).
limit_conn_zone $binary_remote_addr zone=perip:10m;

# Trust the campus gateway, not arbitrary clients. IT must supply the exact
# address or subnet; leaving this as a placeholder is safer than trusting all.
set_real_ip_from 127.0.0.1;  # REPLACE with the campus gateway IP/CIDR
real_ip_header X-Forwarded-For;
real_ip_recursive on;

server {
  listen 80;
  server_name ejustgo.ejust.edu.eg;
  server_tokens off;

  # Static assets are served through Play; compress them here because Play's
  # API gzip only covers JSON responses. Already-gzipped upstream bodies are
  # passed through untouched.
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

  access_log /var/log/nginx/anyplace.access.log;
  error_log /var/log/nginx/anyplace.error.log warn;

  client_max_body_size 100M;
  client_body_timeout 60s;
  client_header_timeout 60s;

  # HSTS belongs on the TLS gateway; do not duplicate it here.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # X-Frame-Options + CSP come from Play SecurityHeadersFilter; do not duplicate here.

  # Never leak Play stack traces as HTML to API clients on bad gateways.
  proxy_intercept_errors on;
  error_page 502 504 = @api_unavailable;

  # Shared proxy hygiene: identical on every location (logs, keepalive, timeouts).
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;  # TLS ends at the campus gateway
  proxy_set_header X-Forwarded-Host $host;
  proxy_connect_timeout 10s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  limit_conn perip 20;

  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://anyplace_play;
  }

  # Auth endpoints: strict anti-brute-force tier (login/register/refresh).
  # Exact matches win over the /api/ prefix above.
  location = /api/user/login {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://anyplace_play;
  }

  location = /api/user/register {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://anyplace_play;
  }

  location = /api/user/refresh {
    limit_req zone=auth_limit burst=5 nodelay;
    proxy_pass http://anyplace_play;
  }

  # Real Play routes: GET|POST /api/floortiles/* (tile archives).
  location /api/floortiles/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://anyplace_play;
    expires 7d;
  }

  # Play serves /architect /viewer from server/public (see WebAppController +
  # MainController; /viewer?cuid= selects the campus app server-side).
  # Entry documents must never be cached: they carry the cache-buster version
  # that points at the current bundle. Only hashed/versioned assets get a TTL.
  location = /architect/ {
    proxy_pass http://anyplace_play;
    expires -1;
  }

  location = /architect/index.html {
    proxy_pass http://anyplace_play;
    expires -1;
  }

  location = /viewer/ {
    proxy_pass http://anyplace_play;
    expires -1;
  }

  location = /viewer/index.html {
    proxy_pass http://anyplace_play;
    expires -1;
  }

  location /architect/ {
    proxy_pass http://anyplace_play;
    expires 1h;
  }

  location /viewer/ {
    proxy_pass http://anyplace_play;
    expires 1h;
  }

  # Developer portal (static) + generated swagger.json it fetches.
  location /developers/ {
    proxy_pass http://anyplace_play;
    expires 1h;
  }

  location /assets/ {
    proxy_pass http://anyplace_play;
    expires 7d;
  }

  # Root only: Play's own GET / redirects to /viewer already; keep the
  # explicit rule so probes and bookmarks land right without shadowing
  # /assets/* or /developers/* (exact match, unlike the old `location /`).
  location = / {
    return 302 /viewer/;
  }

  location @api_unavailable {
    default_type application/json;
    return 503 '{"status":"error","message":"Backend unavailable, retry shortly.","status_code":503}';
  }
}
