apply plugin: 'com.android.application'

import java.net.URI

//def githubProperties = new Properties()
//githubProperties.load(new FileInputStream(rootProject.file("github.properties")))

def loadAnyplaceProperties() {
    def props = new Properties()
    [rootProject.file("secure.properties"), rootProject.file("local.properties"), project.file("local.properties")].each { propFile ->
        if (propFile.exists()) {
            propFile.withInputStream { props.load(it) }
        }
    }
    props
}

def quoteString(String value) {
    "\"" + value.replace("\\", "\\\\").replace("\"", "\\\"") + "\""
}

def anyplaceProps = loadAnyplaceProperties()
def publicBaseUrl = (anyplaceProps.getProperty("PUBLIC_BASE_URL") ?: System.getenv("PUBLIC_BASE_URL") ?: "").trim()
if (publicBaseUrl.endsWith("/")) {
    publicBaseUrl = publicBaseUrl.substring(0, publicBaseUrl.length() - 1)
}
if (!publicBaseUrl) {
    throw new GradleException("PUBLIC_BASE_URL is required for Android Logger builds.")
}
def publicBaseUri = new URI(publicBaseUrl)
if (!publicBaseUri.scheme || !publicBaseUri.host) {
    throw new GradleException("PUBLIC_BASE_URL must be an absolute URL, for example https://staging.example.edu")
}
def publicBasePort = publicBaseUri.port == -1 ? (publicBaseUri.scheme == "https" ? "443" : "80") : publicBaseUri.port.toString()

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.2"

    defaultConfig {
        applicationId "eg.edu.ejust.anyplace.logger"
        minSdkVersion 28
        targetSdkVersion 29
        versionCode 2
        versionName "4.0"

        //testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' CHECK REMOVE?

        // Read the API key from properties into R.string.maps_api_key
        resValue "string", "maps_api_key", (anyplaceProps.getProperty("MAPS_API_KEY") ?: "")
        buildConfigField "String", "PUBLIC_BASE_URL", quoteString(publicBaseUrl)
        buildConfigField "String", "SERVER_HOST", quoteString(publicBaseUri.host)
        buildConfigField "String", "SERVER_PORT", quoteString(publicBasePort)
        buildConfigField "String", "API_BASE_URL", quoteString(publicBaseUrl + "/api")
        buildConfigField "String", "BOOTSTRAP_USERNAME", quoteString(anyplaceProps.getProperty("ANYPLACE_BOOTSTRAP_USERNAME") ?: "")
        buildConfigField "String", "BOOTSTRAP_PASSWORD", quoteString(anyplaceProps.getProperty("ANYPLACE_BOOTSTRAP_PASSWORD") ?: "")
        buildConfigField "String", "BOOTSTRAP_ACCESS_TOKEN", quoteString(anyplaceProps.getProperty("ANYPLACE_BOOTSTRAP_ACCESS_TOKEN") ?: "")


    }

    signingConfigs {
        release {
            def storeFilePath = anyplaceProps.getProperty("ANDROID_KEYSTORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword anyplaceProps.getProperty("ANDROID_KEYSTORE_PASSWORD")
                keyAlias anyplaceProps.getProperty("ANDROID_KEY_ALIAS")
                keyPassword anyplaceProps.getProperty("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (anyplaceProps.getProperty("ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

