apply plugin: 'com.android.application'

import java.net.URI

def loadAnyplaceProperties() {
    def props = new Properties()
    [rootProject.file("secure.properties"), rootProject.file("local.properties"), project.file("local.properties")].each { propFile ->
        if (propFile.exists()) {
            propFile.withInputStream { props.load(it) }
        }
    }
    props
}

def quoteString(String value) {
    "\"" + value.replace("\\", "\\\\").replace("\"", "\\\"") + "\""
}

def anyplaceProps = loadAnyplaceProperties()
def publicBaseUrl = (anyplaceProps.getProperty("PUBLIC_BASE_URL") ?: System.getenv("PUBLIC_BASE_URL") ?: "").trim()
if (publicBaseUrl.endsWith("/")) {
    publicBaseUrl = publicBaseUrl.substring(0, publicBaseUrl.length() - 1)
}
if (!publicBaseUrl) {
    throw new GradleException("PUBLIC_BASE_URL is required for Android Navigator builds.")
}
def publicBaseUri = new URI(publicBaseUrl)
if (!publicBaseUri.scheme || !publicBaseUri.host) {
    throw new GradleException("PUBLIC_BASE_URL must be an absolute URL, for example https://staging.example.edu")
}
def publicBasePort = publicBaseUri.port == -1 ? (publicBaseUri.scheme == "https" ? "443" : "80") : publicBaseUri.port.toString()

android {
    compileSdkVersion 29
    buildToolsVersion "29.0.2"

    defaultConfig {
        applicationId "eg.edu.ejust.anyplace.navigator"
        minSdkVersion 28
        targetSdkVersion 29
        versionCode 2
        versionName "4.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
      // Read protected deployment values from local Gradle properties or the environment.
      resValue "string", "maps_api_key", (anyplaceProps.getProperty("MAPS_API_KEY") ?: "")
      buildConfigField "String", "PUBLIC_BASE_URL", quoteString(publicBaseUrl)
      buildConfigField "String", "SERVER_HOST", quoteString(publicBaseUri.host)
      buildConfigField "String", "SERVER_PORT", quoteString(publicBasePort)
      buildConfigField "String", "API_BASE_URL", quoteString(publicBaseUrl + "/api")
      buildConfigField "String", "BOOTSTRAP_USERNAME", quoteString(anyplaceProps.getProperty("ANYPLACE_BOOTSTRAP_USERNAME") ?: "")
      buildConfigField "String", "BOOTSTRAP_PASSWORD", quoteString(anyplaceProps.getProperty("ANYPLACE_BOOTSTRAP_PASSWORD") ?: "")
      buildConfigField "String", "BOOTSTRAP_ACCESS_TOKEN", quoteString(anyplaceProps.getProperty("ANYPLACE_BOOTSTRAP_ACCESS_TOKEN") ?: "")
      manifestPlaceholders = [anyplaceHost: publicBaseUri.host, anyplaceScheme: publicBaseUri.scheme]

    }

    signingConfigs {
        release {
            def storeFilePath = anyplaceProps.getProperty("ANDROID_KEYSTORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword anyplaceProps.getProperty("ANDROID_KEYSTORE_PASSWORD")
                keyAlias anyplaceProps.getProperty("ANDROID_KEY_ALIAS")
                keyPassword anyplaceProps.getProperty("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            if (anyplaceProps.getProperty("ANDROID_KEYSTORE_FILE")) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

  packagingOptions {
    exclude 'kotlin/internal/internal.kotlin_builtins'
    exclude 'kotlin/reflect/reflect.kotlin_builtins'
    exclude 'okhttp3/internal/publicsuffix/NOTICE'
    exclude 'kotlin/kotlin.kotlin_builtins'
    exclude 'kotlin/coroutines/coroutines.kotlin_builtins'

    exclude 'META-INF/DEPENDENCIES'
    exclude 'META-INF/LICENSE'
    exclude 'META-INF/LICENSE.txt'
    exclude 'META-INF/license.txt'
    exclude 'META-INF/NOTICE'
    exclude 'META-INF/NOTICE.txt'
    exclude 'META-INF/notice.txt'
    exclude 'META-INF/ASL2.0'
    exclude 'kotlin/collections/collections.kotlin_builtins'
    exclude 'kotlin/annotation/annotation.kotlin_builtins'
    exclude("META-INF/*.kotlin_module")
    exclude 'okhttp3/internal/publicsuffix/publicsuffixes.gz'
    exclude 'kotlin/ranges/ranges.kotlin_builtins'

  }
}

dependencies {

  implementation 'androidx.appcompat:appcompat:1.2.0'
  implementation 'com.google.android.gms:play-services-maps:17.0.0'
  implementation 'com.google.android.gms:play-services-location:17.1.0'
  implementation 'com.google.android.gms:play-services-auth:18.1.0'
  implementation 'com.google.maps.android:android-maps-utils:0.3.4'
  implementation 'androidx.constraintlayout:constraintlayout:2.0.1'


  implementation 'com.github.dmsl:anyplace-lib-core:4.0.2'
  implementation 'com.github.dmsl:anyplace-lib-android:4.0.2'
  implementation 'com.squareup.okhttp3:okhttp:4.3.1'
  implementation 'com.squareup.okio:okio:2.4.1'

//  implementation project(path: ':lib')


  //

//  implementation 'com.github.dmsl:anyplace-lib-android:1.0'


  implementation 'androidx.activity:activity:1.2.0-alpha08'
  implementation 'androidx.preference:preference:1.1.0'
  implementation 'com.google.android.material:material:1.0.0'
  testImplementation 'junit:junit:4.13'
  androidTestImplementation 'androidx.test.ext:junit:1.1.1'
  androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'
}

android.applicationVariants.all { variant ->
    variant.assembleProvider.configure {
        doLast {
            copy {
                from variant.outputs.first().outputFile
                into rootProject.file("../../APKs")
                rename { "navigator.apk" }
            }
        }
    }
}
